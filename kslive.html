<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KEYASLIVE — tv chanels for free</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Bebas+Neue&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
/* ── RESET ──────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; }

/* ── VARIABLES ─────────────────────────── */
:root {
  --bg:    #0d1117;
  --bg2:   #161b22;
  --bg3:   #1c2230;
  --sf:    #1e2736;
  --sf2:   #242e42;
  --blue:  #1565C0;
  --blue2: #1976D2;
  --blue3: #2196F3;
  --red:   #D32F2F;
  --red2:  #E53935;
  --grn:   #22c55e;
  --ylw:   #f0b429;
  --text:  #e6edf3;
  --t2:    #8b949e;
  --t3:    #4a5568;
  --bdr:   rgba(255,255,255,0.07);
  --o-sm:  rgba(255,255,255,0.08);
  --o-md:  rgba(255,255,255,0.16);
  --o-lg:  rgba(255,255,255,0.24);
  --r:     12px;
  --rs:    8px;
  --f:     'Inter', sans-serif;
  --m:     'JetBrains Mono', monospace;
  --d:     'Bebas Neue', sans-serif;
  --trans: 0.2s ease;
  --sidebar-w: 320px;
  --glow: 0 0 40px rgba(21,101,192,0.25);
}

[data-theme="light"] {
  --bg:   #f0f4f9;
  --bg2:  #e4eaf3;
  --bg3:  #d9e1ee;
  --sf:   #cdd6e8;
  --sf2:  #bfcadf;
  --red:  #C62828;
  --red2: #D32F2F;
  --grn:  #16a34a;
  --ylw:  #b45309;
  --text: #0d1117;
  --t2:   #3d4f6b;
  --t3:   #7a90b0;
  --bdr:  rgba(0,20,60,0.09);
  --o-sm: rgba(0,20,60,0.10);
  --o-md: rgba(0,20,60,0.13);
  --o-lg: rgba(0,20,60,0.20);
  --glow: 0 0 40px rgba(21,101,192,0.12);
}

/* ── BASE ───────────────────────────────── */
body {
  font-family: var(--f);
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  transition: background var(--trans), color var(--trans);
}

/* ── TOP BAR ───────────────────────────── */
.topbar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 20px;
  height: 56px;
  background: var(--bg2);
  border-bottom: 1px solid var(--bdr);
  flex-shrink: 0;
  z-index: 100;
}

.logo {
  font-family: var(--d);
  font-size: 24px;
  letter-spacing: 2px;
  color: var(--blue3);
  text-shadow: 0 0 20px rgba(33,150,243,0.4);
  user-select: none;
  flex-shrink: 0;
}

.logo span { color: var(--text); opacity: 0.6; }

.playlist-tabs {
  display: flex;
  gap: 4px;
  flex: 1;
  overflow-x: auto;
  scrollbar-width: none;
  padding: 0 8px;
}
.playlist-tabs::-webkit-scrollbar { display: none; }

.pl-tab {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 14px;
  border-radius: 8px;
  background: transparent;
  border: 1px solid transparent;
  color: var(--t2);
  font-family: var(--f);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all var(--trans);
  white-space: nowrap;
  flex-shrink: 0;
}
.pl-tab:hover {
  background: var(--o-sm);
  color: var(--text);
  border-color: var(--bdr);
}
.pl-tab.active {
  background: var(--blue);
  color: #fff;
  border-color: var(--blue2);
  box-shadow: 0 2px 12px rgba(21,101,192,0.4);
}
.pl-tab .dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: currentColor;
  opacity: 0.6;
}
.pl-tab.active .dot { background: var(--grn); opacity: 1; animation: pulse-dot 2s infinite; }

@keyframes pulse-dot {
  0%,100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.5; transform: scale(0.7); }
}

.topbar-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}

.icon-btn {
  width: 36px; height: 36px;
  border-radius: var(--rs);
  background: var(--o-sm);
  border: 1px solid var(--bdr);
  color: var(--t2);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
  transition: all var(--trans);
}
.icon-btn:hover { background: var(--o-md); color: var(--text); }
.icon-btn.active { background: var(--blue); color: #fff; border-color: var(--blue2); }

/* ── MAIN LAYOUT ──────────────────────── */
.main {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* ── SIDEBAR ──────────────────────────── */
.sidebar {
  width: var(--sidebar-w);
  background: var(--bg2);
  border-right: 1px solid var(--bdr);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  transition: width var(--trans), transform var(--trans);
}

.sidebar.collapsed { width: 0; overflow: hidden; }

.sidebar-header {
  padding: 14px 16px 10px;
  border-bottom: 1px solid var(--bdr);
  flex-shrink: 0;
}

@keyframes slideUp {
  from { transform: translateY(100%); }
  to   { transform: translateY(0); }
}

.search-wrap {
  position: relative;
}
.search-wrap svg {
  position: absolute;
  left: 10px; top: 50%;
  transform: translateY(-50%);
  color: var(--t3);
  pointer-events: none;
}
.search-input {
  width: 100%;
  padding: 8px 10px 8px 34px;
  background: var(--bg3);
  border: 1px solid var(--bdr);
  border-radius: var(--rs);
  color: var(--text);
  font-family: var(--f);
  font-size: 13px;
  outline: none;
  transition: border-color var(--trans);
}
.search-input:focus { border-color: var(--blue2); }
.search-input::placeholder { color: var(--t3); }

.group-filters {
  display: flex;
  gap: 4px;
  margin-top: 8px;
  overflow-x: auto;
  scrollbar-width: none;
}
.group-filters::-webkit-scrollbar { display: none; }

.g-chip {
  padding: 3px 10px;
  border-radius: 20px;
  background: var(--o-sm);
  border: 1px solid var(--bdr);
  color: var(--t2);
  font-size: 11px;
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
  transition: all var(--trans);
}
.g-chip.active {
  background: var(--blue);
  color: #fff;
  border-color: transparent;
}

.channel-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px;
  scrollbar-width: thin;
  scrollbar-color: var(--sf2) transparent;
}
.channel-list::-webkit-scrollbar { width: 4px; }
.channel-list::-webkit-scrollbar-thumb { background: var(--sf2); border-radius: 4px; }

.ch-group-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--t3);
  padding: 10px 8px 4px;
  font-family: var(--m);
}

.ch-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 10px;
  border-radius: var(--rs);
  cursor: pointer;
  transition: background var(--trans);
  border: 1px solid transparent;
}
.ch-item:hover { background: var(--o-sm); }
.ch-item.active {
  background: rgba(21,101,192,0.18);
  border-color: rgba(21,101,192,0.35);
}

.ch-logo {
  width: 36px; height: 36px;
  border-radius: 6px;
  background: var(--bg3);
  border: 1px solid var(--bdr);
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
  font-size: 11px;
  font-weight: 700;
  color: var(--t2);
  text-transform: uppercase;
}
.ch-logo img { width: 100%; height: 100%; object-fit: cover; }

.ch-info { flex: 1; min-width: 0; }
.ch-name {
  font-size: 13px;
  font-weight: 500;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  line-height: 1.3;
}
.ch-meta {
  font-size: 11px;
  color: var(--t2);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-family: var(--m);
  margin-top: 2px;
}

.ch-item.active .ch-name { color: var(--blue3); }

.eq-bars {
  display: flex;
  align-items: flex-end;
  gap: 2px;
  height: 16px;
  flex-shrink: 0;
}
.eq-bar {
  width: 3px;
  background: var(--blue3);
  border-radius: 2px;
  animation: eq 0.8s ease-in-out infinite alternate;
}
.eq-bar:nth-child(1) { animation-delay: 0s; }
.eq-bar:nth-child(2) { animation-delay: 0.15s; }
.eq-bar:nth-child(3) { animation-delay: 0.3s; }

@keyframes eq {
  from { height: 3px; }
  to   { height: 14px; }
}

/* ── PLAYER AREA ──────────────────────── */
.player-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--bg);
}

/* Video container */
.video-wrap {
  position: relative;
  background: #000;
  flex-shrink: 0;
}

.video-wrap.theater {
  /* takes full remaining height */
}

video {
  width: 100%;
  display: block;
  max-height: calc(100vh - 56px - 72px - 64px);
  background: #000;
}

/* Overlay: click to play/pause */
.vid-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}

.big-play {
  width: 72px; height: 72px;
  border-radius: 50%;
  background: rgba(0,0,0,0.4);
  backdrop-filter: blur(3px);
  display: flex; align-items: center; justify-content: center;
  font-size: 28px;
  color: #fff;
  transition: all 0.15s ease;
  opacity: 0;
  transform: scale(0.8);
}
.big-play.show { opacity: 1; transform: scale(1); }

/* Channel info overlay (top) */
.now-playing-bar {
  position: absolute;
  top: 0; left: 0; right: 0;
  padding: 17px 18px;
  background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, transparent 100%);
  display: flex;
  align-items: center;
  gap: 12px;
  opacity: 0;
  transition: opacity var(--trans);
  pointer-events: none;
  justify-content: space-between;
}
.video-wrap.controls-visible .now-playing-bar { opacity: 1; }
  
:fullscreen .now-playing-bar,
:-webkit-full-screen .now-playing-bar,
:-moz-full-screen .now-playing-bar {
  opacity: 1;
  padding: 20px 28px;
  gap: 14px;
}

.np-logo {
  width: 38px; height: 38px;
  border-radius: 8px;
  object-fit: cover;
  background: var(--bg3);
  border: 1px solid rgba(255,255,255,0.15);
  display: none;
  flex-shrink: 0;
}
.np-logo.show { display: block; }

:fullscreen .np-logo,
:-webkit-full-screen .np-logo,
:-moz-full-screen .np-logo { display: block; }  /* fullscreen এ দেখাবে */

:fullscreen .np-name,
:-webkit-full-screen .np-name,
:-moz-full-screen .np-name {
  font-size: 18px;
  font-weight: 700;
}

.live-badge {
  padding: 3px 9px;
  background: var(--red);
  border-radius: 4px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1px;
  color: #fff;
  text-transform: uppercase;
  font-family: var(--m);
  display: none;
  flex-shrink: 0;
  align-items: center;
  gap: 5px;
}
.live-badge::before {
  content: '';
  width: 5px; height: 5px;
  border-radius: 50%;
  background: #fff;
  display: inline-block;
  animation: pulse-live 1.5s infinite;
}
.live-badge.visible {
  display: flex;
  animation: none;
}
@keyframes pulse-live {
  0%,100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.4; transform: scale(0.7); }
}


:fullscreen .live-badge.visible,
:-webkit-full-screen .live-badge.visible,
:-moz-full-screen .live-badge.visible {
  font-size: 11px;
  padding: 4px 11px;
}

@keyframes pulse-live {
  0%,100% { opacity: 1; }
  50% { opacity: 0.65; }
}

.np-name {
  font-size: 16px;
  font-weight: 600;
  color: #fff;
  text-shadow: 0 1px 4px rgba(0,0,0,0.5);
}

/* ── VIDEO CONTROLS ────────────────────── */
.vid-controls {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  padding: 0 16px 12px;
  background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, transparent 100%);
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--trans);
}
.video-wrap.controls-visible .vid-controls {
  opacity: 1;
  pointer-events: auto;
}

.progress-bar-wrap {
  position: relative;
  height: 5px;
  background: rgba(255,255,255,0.2);
  border-radius: 4px;
  margin-bottom: 10px;
  cursor: pointer;
}
.progress-fill {
  height: 100%;
  background: var(--blue3);
  border-radius: 4px;
  width: 0%;
  transition: width 0.5s linear;
  position: relative;
}
.progress-thumb {
  position: absolute;
  right: -5px; top: -4px;
  width: 12px; height: 12px;
  border-radius: 50%;
  background: #fff;
  opacity: 0;
  transition: opacity var(--trans);
}
.progress-bar-wrap:hover .progress-thumb { opacity: 1; }

.controls-row {
  display: flex;
  align-items: center;
  gap: 10px;
}

.ctrl-btn {
  background: none;
  border: none;
  color: rgba(255,255,255,0.9);
  cursor: pointer;
  font-size: 18px;
  padding: 4px;
  border-radius: 6px;
  display: flex; align-items: center;
  transition: color var(--trans), background var(--trans);
}
.ctrl-btn:hover { color: #fff; background: rgba(255,255,255,0.1); }
.ctrl-btn.active { color: var(--blue3); }

.vol-wrap {
  display: flex;
  align-items: center;
  gap: 6px;
}
.vol-slider {
  width: 80px;
  accent-color: var(--blue3);
  cursor: pointer;
}

.time-display {
  font-size: 9px;
  color: rgba(255, 255, 255, 0.9);
  margin-left: 4px;
  background: rgba(0, 0, 0, 0.4);
  padding: 2px 2px;
  border-radius: 4px;
  letter-spacing: -0.5px;
  text-align: center;
}

.ctrl-spacer { flex: 1; }

.quality-badge {
  font-family: var(--m);
  font-size: 10px;
  font-weight: 500;
  padding: 2px 7px;
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 4px;
  color: rgba(255,255,255,0.7);
}

/* ── INFO PANEL (below video) ─────────── */
.info-panel {
  flex: 1;
  overflow-y: auto;
  padding: 16px 20px;
  scrollbar-width: thin;
  scrollbar-color: var(--sf2) transparent;
}

.ch-detail-header {
  display: flex;
  align-items: flex-start;
  gap: 14px;
  margin-bottom: 16px;
}

.ch-detail-logo {
  width: 52px; height: 52px;
  border-radius: 10px;
  background: var(--bg3);
  border: 1px solid var(--bdr);
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
  font-size: 14px;
  font-weight: 700;
  color: var(--t2);
  text-transform: uppercase;
  flex-shrink: 0;
}
.ch-detail-logo img { width: 100%; height: 100%; object-fit: cover; }

.ch-detail-info { flex: 1; }
.ch-detail-name {
  font-size: 18px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 4px;
}
.ch-detail-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.meta-tag {
  padding: 2px 8px;
  background: var(--o-sm);
  border: 1px solid var(--bdr);
  border-radius: 4px;
  font-size: 11px;
  font-family: var(--m);
  color: var(--t2);
}
.meta-tag.blue { background: rgba(21,101,192,0.15); border-color: rgba(21,101,192,0.3); color: var(--blue3); }

.stream-url-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 12px;
  background: var(--bg3);
  border: 1px solid var(--bdr);
  border-radius: var(--rs);
  margin-bottom: 12px;
}
.stream-url-text {
  flex: 1;
  font-family: var(--m);
  font-size: 11px;
  color: var(--t2);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.copy-btn {
  background: var(--o-sm);
  border: 1px solid var(--bdr);
  border-radius: 6px;
  color: var(--t2);
  padding: 4px 10px;
  font-size: 11px;
  cursor: pointer;
  transition: all var(--trans);
  white-space: nowrap;
  font-family: var(--f);
}
.copy-btn:hover { background: var(--blue); color: #fff; border-color: transparent; }

/* ── STATUS BAR ──────────────────────── */
.statusbar {
  height: 32px;
  background: var(--bg2);
  border-top: 1px solid var(--bdr);
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 0 16px;
  font-family: var(--m);
  font-size: 11px;
  color: var(--t3);
  flex-shrink: 0;
}
.status-item { display: flex; align-items: center; gap: 5px; }
.status-dot { width: 6px; height: 6px; border-radius: 50%; }
.status-dot.green { background: var(--grn); box-shadow: 0 0 6px var(--grn); }
.status-dot.red { background: var(--red); }
.status-dot.yellow { background: var(--ylw); }

/* ── LOADING SCREEN ─────────────────── */
.loading-screen {
  position: fixed;
  inset: 0;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
  z-index: 9999;
  transition: opacity 0.4s ease, visibility 0.4s ease;
}
.loading-screen.hidden { opacity: 0; visibility: hidden; }

.loader-logo {
  font-family: var(--d);
  font-size: 48px;
  letter-spacing: 4px;
  color: var(--blue3);
  text-shadow: 0 0 30px rgba(33,150,243,0.5);
}
.loader-bar-wrap {
  width: 200px;
  height: 3px;
  background: var(--o-sm);
  border-radius: 3px;
  overflow: hidden;
}
.loader-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--blue), var(--blue3));
  border-radius: 3px;
  animation: load-anim 1.5s ease-in-out infinite;
}
@keyframes load-anim {
  0%   { width: 0%; margin-left: 0; }
  50%  { width: 70%; margin-left: 0; }
  100% { width: 0%; margin-left: 100%; }
}
.loader-text { font-size: 13px; color: var(--t2); }

/* ── ERROR STATE ────────────────────── */
.error-state {
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 40px;
  color: var(--t2);
  text-align: center;
}
.error-state.show { display: flex; }
.error-icon { font-size: 40px; }
.error-title { font-size: 15px; font-weight: 600; color: var(--text); }
.error-msg { font-size: 13px; color: var(--t2); max-width: 300px; }
.retry-btn {
  margin-top: 8px;
  padding: 8px 20px;
  background: var(--blue);
  border: none;
  border-radius: var(--rs);
  color: #fff;
  font-size: 13px;
  font-family: var(--f);
  cursor: pointer;
  transition: background var(--trans);
}
.retry-btn:hover { background: var(--blue2); }

/* ── TOAST ──────────────────────────── */
.toast {
  position: fixed;
  bottom: 50px; right: 20px;
  padding: 10px 16px;
  background: var(--sf);
  border: 1px solid var(--bdr);
  border-radius: var(--rs);
  font-size: 13px;
  color: var(--text);
  box-shadow: 0 8px 24px rgba(0,0,0,0.3);
  z-index: 9998;
  transform: translateY(10px);
  opacity: 0;
  transition: all 0.3s ease;
  pointer-events: none;
}
.toast.show { transform: translateY(0); opacity: 1; }

/* ── MOBILE ─────────────────────────── */
@media (max-width: 768px) {
  :root { --sidebar-w: 100vw; }

  body { overflow: hidden; }

  .main { position: relative; }

  .sidebar {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    z-index: 50;
    transform: translateX(-100%);
    transition: transform var(--trans);
    width: 100%;
  }
  .sidebar.mobile-open { transform: translateX(0); }
  .sidebar.collapsed { transform: translateX(-100%); width: 100%; }

  .player-area { width: 100%;}

  video { max-height: 240px; }

  .playlist-tabs { display: none; }

  .topbar { padding: 0 12px;  justify-content: space-between; }
  .logo { font-size: 30px; }

  .info-panel { padding: 12px; }
  .ch-detail-name { font-size: 15px; }

  .vol-slider { width: 60px; }
}

/* ── SCROLLBAR GLOBAL ───────────────── */

<script>
/* ═══════════════════════════════════════════════════════
   PLAYLIST CONFIG
   Add as many playlists as you want here.
   Each playlist can be:
     • A direct URL to an .m3u / .m3u8 file
     • A data URI (already loaded text)
     • An inline string (raw M3U content)
   ═══════════════════════════════════════════════════════ */
const PLAYLISTS_JSON_URL = "https://raw.githubusercontent.com/marufhossainkeyas11/Cricket-Score/refs/heads/main/playlist.json";

let PLAYLISTS = [];

/* ═══════════════════════════════════════════════════════
   M3U PARSER
   Handles: #EXTINF, #EXTVLCOPT, cookies, user-agent,
   referrer, group-title, tvg-logo, tvg-id, tvg-name
   ═══════════════════════════════════════════════════════ */
function parseM3U(text) {
  const lines = text.split(/\r?\n/);
  const channels = [];
  let current = null;

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i].trim();
    if (!line) continue;

    if (line.startsWith('#EXTM3U')) continue;

    if (line.startsWith('#EXTINF:')) {
      current = {
        name: '',
        group: 'General',
        logo: '',
        tvgId: '',
        url: '',
        cookies: '',
        userAgent: '',
        referrer: '',
        headers: {},
        rawExtinf: line
      };

      // Duration + attributes
      const afterDuration = line.replace(/^#EXTINF:\s*-?\d+(\.\d+)?/, '');

      // Extract attributes: key="value"
      const attrRx = /([\w-]+)="([^"]*)"/g;
      let m;
      while ((m = attrRx.exec(afterDuration)) !== null) {
        const k = m[1].toLowerCase();
        const v = m[2];
        if (k === 'group-title')       current.group = v || 'General';
        else if (k === 'tvg-logo')     current.logo  = v;
        else if (k === 'tvg-id')       current.tvgId = v;
        else if (k === 'tvg-name')     current.name  = v;
        else if (k === 'tvg-chno')     current.chno  = v;
        else if (k === 'user-agent')   current.userAgent = v;
        else if (k === 'referrer')     current.referrer  = v;
        else if (k === 'cookie' || k === 'http-cookie') current.cookies = v;
      }

      // Friendly display name (after last comma)
      const commaIdx = afterDuration.lastIndexOf(',');
      if (commaIdx !== -1) {
        const rawName = afterDuration.substring(commaIdx + 1).trim();
        if (rawName && !current.name) current.name = rawName;
      }
      if (!current.name) current.name = 'Unknown Channel';
      continue;
    }

    // VLC options (user-agent, cookie, referrer, etc.)
    if (line.startsWith('#EXTVLCOPT:') && current) {
      const opt = line.replace('#EXTVLCOPT:', '').trim();
      if (opt.startsWith('http-user-agent='))  current.userAgent = opt.split('=').slice(1).join('=');
      else if (opt.startsWith('http-referrer='))current.referrer = opt.split('=').slice(1).join('=');
      else if (opt.startsWith('http-cookie=')) current.cookies = opt.split('=').slice(1).join('=');
      continue;
    }

    // KODIPROP / other header directives
    if ((line.startsWith('#KODIPROP:') || line.startsWith('#EXTHTTP:')) && current) {
      const val = line.split(':').slice(1).join(':').trim();
      if (val.startsWith('inputstream.adaptive.stream_headers=')) {
        const hdrStr = val.split('=').slice(1).join('=');
        hdrStr.split('&').forEach(pair => {
          const [hk, hv] = pair.split('=');
          if (hk && hv) current.headers[decodeURIComponent(hk)] = decodeURIComponent(hv);
        });
      }
      if (val.startsWith('http-user-agent=')) current.userAgent = val.split('=').slice(1).join('=');
      continue;
    }

    // Stream URL
    if (current && !line.startsWith('#') && line.length > 0) {
      current.url = line;
      // Build combined headers object
      const hdrs = { ...current.headers };
      if (current.userAgent) hdrs['User-Agent'] = current.userAgent;
      if (current.referrer)  hdrs['Referer'] = current.referrer;
      if (current.cookies)   hdrs['Cookie']  = current.cookies;
      current.compiledHeaders = hdrs;
      channels.push(current);
      current = null;
    }
  }
  return channels;
}

/* ═══════════════════════════════════════════════════════
   APP STATE
   ═══════════════════════════════════════════════════════ */
const state = {
  playlists: [],          // [{name, channels[]}]
  activePlaylist: 0,
  channels: [],           // flat current playlist channels
  filteredChannels: [],
  activeGroup: 'All',
  currentIdx: -1,
  hls: null,
  isPlaying: false,
  isMuted: false,
  retryCount: 0,
  MAX_RETRY: 3
};

   DOM REFS
   ═══════════════════════════════════════════════════════ */

const qualityBadge = $('qualityBadge');

const connStatus   = $('connStatus');

/* ═══════════════════════════════════════════════════════
   TOAST
   ═══════════════════════════════════════════════════════ */
let toastTimer;
function showToast(msg, duration = 2500) {
  clearTimeout(toastTimer);
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), duration);
}

/* ═══════════════════════════════════════════════════════
   FETCH M3U
   ═══════════════════════════════════════════════════════ */
async function fetchM3U(pl) {
  const { url, fetchHeaders } = pl;

  // Raw inline content (not a URL)
  if (!url.startsWith('http') && !url.startsWith('//')) {
    return url;
  }

  // Try direct fetch first
  try {
    const resp = await fetch(url, {
      headers: fetchHeaders || {},
      cache: 'no-cache'
    });
    if (resp.ok) return await resp.text();
  } catch (e) {
    console.warn('Direct fetch failed, trying CORS proxy…', e);
  }

  // Fallback: CORS proxy
  const proxies = [
    `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
    `https://corsproxy.io/?${encodeURIComponent(url)}`
  ];
  for (const proxy of proxies) {
    try {
      const resp = await fetch(proxy);
      if (resp.ok) return await resp.text();
    } catch {}
  }
  throw new Error('Failed to fetch playlist after trying proxies.');
}

/* ═══════════════════════════════════════════════════════
   INIT
   ═══════════════════════════════════════════════════════ */
async function init() {
  try {
    const res = await fetch(PLAYLISTS_JSON_URL + '?t=' + Date.now());
    PLAYLISTS = await res.json();
  } catch (e) {
    console.error('Failed to load playlists config:', e);
    PLAYLISTS = [];
  }
  //$('loadText').textContent = `Loading ${PLAYLISTS.length} playlist(s)…`;

  const results = await Promise.allSettled(
    PLAYLISTS.map(async (pl, idx) => {
      const text = await fetchM3U(pl);
      const channels = parseM3U(text);
      return { name: pl.name, channels };
    })
  );

  results.forEach((r, i) => {
    if (r.status === 'fulfilled') {
      state.playlists.push(r.value);
    } else {
      console.error(`Playlist "${PLAYLISTS[i].name}" failed:`, r.reason);
      state.playlists.push({ name: PLAYLISTS[i].name, channels: [], error: r.reason?.message });
    }
  });

  buildPlaylistTabs();
  switchPlaylist(0);
  
  // Restore last channel
  const last = loadLastChannel();
  if (last && state.playlists[last.plIdx]?.channels[last.chIdx]) {
    switchPlaylist(last.plIdx);
    setTimeout(() => playChannel(last.chIdx), 500);
  }

  checkMobile();
  setTimeout(() => loadingScreen.classList.add('hidden'), 600);
}

/* ═══════════════════════════════════════════════════════
   PLAYLIST TABS
   ═══════════════════════════════════════════════════════ */
function buildPlaylistTabs() {
  playlistTabs.innerHTML = '';
  state.playlists.forEach((pl, idx) => {
    const tab = document.createElement('button');
    tab.className = 'pl-tab' + (idx === 0 ? ' active' : '');
    tab.innerHTML = `<span class="dot"></span>${escHtml(pl.name)}
      <span style="font-family:var(--m);font-size:10px;opacity:0.6;margin-left:2px">(${pl.channels.length})</span>`;
    tab.addEventListener('click', () => switchPlaylist(idx));
    playlistTabs.appendChild(tab);
  });
}

function switchPlaylist(idx) {
  state.activePlaylist = idx;
  state.channels = state.playlists[idx]?.channels || [];
  state.currentIdx = -1;

  document.querySelectorAll('.pl-tab').forEach((t, i) => {
    t.classList.toggle('active', i === idx);
  });

  state.activeGroup = 'All';
  buildGroupFilters();
  applyFilter();
  updateChCount();
}

/* ═══════════════════════════════════════════════════════
   GROUP FILTERS
   ═══════════════════════════════════════════════════════ */
function buildGroupFilters() {
  const groups = ['All', ...new Set(state.channels.map(c => c.group))].sort((a,b) => {
    if (a === 'All') return -1;
    if (b === 'All') return 1;
    return a.localeCompare(b);
  });

  groupFilters.innerHTML = '';
  groups.forEach(g => {
    const chip = document.createElement('div');
    chip.className = 'g-chip' + (g === state.activeGroup ? ' active' : '');
    chip.textContent = g;
    chip.addEventListener('click', () => {
      state.activeGroup = g;
      document.querySelectorAll('.g-chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      applyFilter();
    });
    groupFilters.appendChild(chip);
  });
}

/* ═══════════════════════════════════════════════════════
   FILTER + RENDER CHANNEL LIST
   ═══════════════════════════════════════════════════════ */
function applyFilter() {
  const q = searchInput.value.toLowerCase().trim();
  state.filteredChannels = state.channels.filter(ch => {
    const groupMatch = state.activeGroup === 'All' || ch.group === state.activeGroup;
    const nameMatch  = !q || ch.name.toLowerCase().includes(q) || (ch.group || '').toLowerCase().includes(q);
    return groupMatch && nameMatch;
  });
  renderChannelList();
}

function renderChannelList() {
  channelList.innerHTML = '';
  const grouped = {};
  state.filteredChannels.forEach(ch => {
    if (!grouped[ch.group]) grouped[ch.group] = [];
    grouped[ch.group].push(ch);
  });

  if (Object.keys(grouped).length === 0) {
    channelList.innerHTML = `<div class="empty-state"><div class="empty-icon">🔍</div><div class="empty-title">No channels found</div></div>`;
    return;
  }

  Object.entries(grouped).sort(([a],[b]) => a.localeCompare(b)).forEach(([group, chs]) => {
    if (state.activeGroup === 'All') {
      const label = document.createElement('div');
      label.className = 'ch-group-label';
      label.textContent = group;
      channelList.appendChild(label);
    }

    chs.forEach(ch => {
      const globalIdx = state.channels.indexOf(ch);
      const item = document.createElement('div');
      item.className = 'ch-item' + (globalIdx === state.currentIdx ? ' active' : '');
      item.dataset.idx = globalIdx;

      const logoHtml = ch.logo
        ? `<div class="ch-logo"><img src="${escAttr(ch.logo)}" alt="" onerror="this.parentNode.textContent='${escHtml(ch.name.substring(0,3))}'"></div>`
        : `<div class="ch-logo">${escHtml(ch.name.substring(0,3))}</div>`;

      const eqHtml = globalIdx === state.currentIdx
        ? `<div class="eq-bars"><div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div></div>`
        : '';

      item.innerHTML = `
        ${logoHtml}
        <div class="ch-info">
          <div class="ch-name">${escHtml(ch.name)}</div>
          <div class="ch-meta">${escHtml(ch.group)}</div>
        </div>
        ${eqHtml}
      `;
      item.addEventListener('click', () => playChannel(globalIdx));
      channelList.appendChild(item);
    });
  });
}

function updateChCount() {
  chCount.textContent = `${state.channels.length} channels`;
}

/* ═══════════════════════════════════════════════════════
   PLAYER
   ═══════════════════════════════════════════════════════ */
function playChannel(idx) {
  const ch = state.channels[idx];
  if (!ch) return;
  
  saveLastChannel(state.activePlaylist, idx);
  
  state.currentIdx = idx;
  state.retryCount = 0;
  errorState.classList.remove('show');

  // Update sidebar selection
  renderChannelList();

  // Update info panel
  if (window.innerWidth <= 768) {
    sidebar.classList.remove('mobile-open');
  }
  emptyState.style.display = 'none';
  channelDetail.style.display = 'block';
  npName.textContent = ch.name;
  detailName.textContent = ch.name;
  
  const npLogo = $('npLogo');
  if (ch.logo) {
    npLogo.src = ch.logo;
    npLogo.classList.add('show');
  } else {
    npLogo.src = '';
    npLogo.classList.remove('show');
  }

  // Logo
  detailLogo.innerHTML = ch.logo
    ? `<img src="${escAttr(ch.logo)}" alt="" onerror="this.parentNode.textContent='${escHtml(ch.name.substring(0,3))}'"><span style="display:none">${escHtml(ch.name.substring(0,3))}</span>`
    : escHtml(ch.name.substring(0,3));

  // Meta tags
  detailMeta.innerHTML = [
    ch.group && `<span class="meta-tag">${escHtml(ch.group)}</span>`,
    ch.tvgId && `<span class="meta-tag blue">${escHtml(ch.tvgId)}</span>`,
    Object.keys(ch.compiledHeaders||{}).length && `<span class="meta-tag">🔐 Headers</span>`,
  ].filter(Boolean).join('');

  //    URL
  //  streamUrlText.textContent = ch.url;
  //  streamUrlText.title = ch.url;

  loadStream(ch);
}

function loadStream(ch) {
  // Destroy previous HLS instance
  if (state.hls) {
    state.hls.destroy();
    state.hls = null;
  }
  videoEl.src = '';

  setStatus('Connecting…', 'yellow');
  qualityBadge.textContent = 'HLS';

  const url = ch.url;
  const hdrs = ch.compiledHeaders || {};

  // Detect stream type
  const isHLS = url.includes('.m3u8') || url.includes('playlist') || url.includes('hls');
  const isMPD = url.includes('.mpd');

  if (Hls.isSupported() && (isHLS || !videoEl.canPlayType('application/vnd.apple.mpegurl'))) {
    const hlsConfig = {
      // Pass headers if possible (note: browser CORS may block custom headers)
      xhrSetup: (xhr, streamUrl) => {
        if (hdrs['User-Agent'])  xhr.setRequestHeader('User-Agent', hdrs['User-Agent']);
        if (hdrs['Referer'])     xhr.setRequestHeader('Referer', hdrs['Referer']);
        // Cookie cannot be set via JS XHR (browser security), server-side proxy needed
      },
      enableWorker: true,
      lowLatencyMode: true,
      backBufferLength: 30,
      maxBufferLength: 60,
      maxMaxBufferLength: 120,
      capLevelToPlayerSize: true,
      startLevel: -1,   // Auto quality
    };

    const hls = new Hls(hlsConfig);
    state.hls = hls;

    hls.loadSource(url);
    hls.attachMedia(videoEl);

    hls.on(Hls.Events.MANIFEST_PARSED, (e, data) => {
      const levels = data.levels;
      qualityBadge.textContent = levels.length > 1 ? `AUTO · ${levels.length}Q` : 'HLS';
      videoEl.play().catch(() => {});
      setStatus('Playing', 'green');
      state.isPlaying = true;
      updatePlayPauseIcon();
    });

    hls.on(Hls.Events.LEVEL_SWITCHED, (e, data) => {
      const lv = hls.levels[data.level];
      if (lv) {
        const h = lv.height || '';
        qualityBadge.textContent = h ? `${h}p` : 'HLS';
      }
    });

    hls.on(Hls.Events.ERROR, (e, data) => {
      console.error('HLS error:', data.type, data.details, data.fatal);
      if (data.fatal) {
        if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
          if (state.retryCount < state.MAX_RETRY) {
            state.retryCount++;
            setStatus(`Reconnecting (${state.retryCount}/${state.MAX_RETRY})…`, 'yellow');
            setTimeout(() => hls.startLoad(), 2000);
          } else {
            showError('Network error. Stream may be offline or CORS-blocked.');
          }
        } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
          setStatus('Recovering media…', 'yellow');
          hls.recoverMediaError();
        } else {
          showError('Fatal stream error. Try another channel.');
        }
      }
    });

  } else if (videoEl.canPlayType('application/vnd.apple.mpegurl')) {
    // Native HLS (Safari)
    videoEl.src = url;
    videoEl.play().catch(() => {});
    qualityBadge.textContent = 'Native HLS';
    setStatus('Playing', 'green');
    state.isPlaying = true;
    updatePlayPauseIcon();
  } else {
    // Direct stream (MP4, RTMP wrapped, etc.)
    videoEl.src = url;
    videoEl.play().catch(() => {});
    qualityBadge.textContent = 'Direct';
    setStatus('Playing', 'green');
    state.isPlaying = true;
    updatePlayPauseIcon();
  }
}

function showError(msg) {
  setStatus('Error', 'red');
  errorState.classList.add('show');
  $('errorMsg').textContent = msg;
  state.isPlaying = false;
  updatePlayPauseIcon();
}

function setStatus(text, color) {
  connStatus.textContent = text;
  connDot.style.background = color === 'green' ? 'var(--grn)' :
    color === 'red' ? 'var(--red)' :
    color === 'yellow' ? 'var(--ylw)' :
    'var(--t3)';
  connDot.style.boxShadow = color === 'green' ? '0 0 6px var(--grn)' : 'none';
  const liveBadge = document.querySelector('.live-badge');
  if (color === 'green' && text === 'Playing') {
    liveBadge.classList.add('visible');
  } else {
    liveBadge.classList.remove('visible');
  }
}

let tapTimer = null;
let tapCount = 0;

videoWrap.addEventListener('click', (e) => {
  if (state.currentIdx === -1) return;
  // শুধু interactive element গুলো ignore
  if (e.target.closest('.ctrl-btn')) return;
  if (e.target.closest('input[type="range"]')) return;
  if (e.target.closest('.progress-bar-wrap')) return;
  if (e.target.closest('.more-popup')) return;

  tapCount++;

  if (tapCount === 1) {
    tapTimer = setTimeout(() => {
      tapCount = 0;
      // single tap: toggle controls
      if (videoWrap.classList.contains('controls-visible')) {
        videoWrap.classList.remove('controls-visible');
        clearTimeout(hideTimer);
      } else {
        videoWrap.classList.add('controls-visible');
        clearTimeout(hideTimer);
        hideTimer = setTimeout(() => {
          if (morePopup.classList.contains('open')) return;
          videoWrap.classList.remove('controls-visible');
        }, 3000);
      }
    }, 250);

  } else if (tapCount === 2) {
    clearTimeout(tapTimer);
    tapCount = 0;
    // double tap: play/pause
    togglePlayPause();
    $('bigPlayIcon').querySelector('path').setAttribute('d',
      state.isPlaying ? 'M6 19h4V5H6v14zm8-14v14h4V5h-4z' : 'M8 5v14l11-7z');
    bigPlay.classList.add('show');
    setTimeout(() => bigPlay.classList.remove('show'), 700);
    videoWrap.classList.add('controls-visible');
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => {
      if (morePopup.classList.contains('open')) return;
      videoWrap.classList.remove('controls-visible');
    }, 3000);
  }
});

function togglePlayPause() {
  if (videoEl.paused) {
    videoEl.play();
    state.isPlaying = true;
  } else {
    videoEl.pause();
    state.isPlaying = false;

  updatePlayPauseIcon();
}

  }
}

// Progress bar (for VOD, not live)
videoEl.addEventListener('timeupdate', () => {
  if (!videoEl.duration || isNaN(videoEl.duration)) {
    timeDisplay.textContent = 'LIVE';
    progressFill.style.width = '100%';
    return;
  }
  const pct = (videoEl.currentTime / videoEl.duration) * 100;
  progressFill.style.width = pct + '%';
  timeDisplay.textContent = fmtTime(videoEl.currentTime) + ' / ' + fmtTime(videoEl.duration);
});

$('progressWrap').addEventListener('click', e => {
  if (!videoEl.duration || isNaN(videoEl.duration)) return;
  const rect = e.currentTarget.getBoundingClientRect();
  const pct = (e.clientX - rect.left) / rect.width;
  videoEl.currentTime = pct * videoEl.duration;
});

function fmtTime(s) {
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = Math.floor(s % 60);
  return h > 0 ? `${h}:${pad(m)}:${pad(sec)}` : `${pad(m)}:${pad(sec)}`;
}
function pad(n) { return String(n).padStart(2,'0'); }

    animation: slideUp 0.25s ease;
  `;

  function closePopup() {
    popup.remove();

  }

  backdrop.addEventListener('click', closePopup);

  const title = document.createElement('div');
  title.style.cssText = `
    font-size:12px; font-weight:700; letter-spacing:1.5px;

  popup.appendChild(title);

  state.playlists.forEach((pl, idx) => {
    const row = document.createElement('div');
    row.style.cssText = `
      display:flex; align-items:center; gap:12px;
      padding:12px 20px; cursor:pointer;
      transition:background 0.15s;
      background:${idx === state.activePlaylist ? 'rgba(21,101,192,0.15)' : 'transparent'};
    `;
    row.innerHTML = `
      <div style="width:8px;height:8px;border-radius:50%;
        background:${idx === state.activePlaylist ? 'var(--blue3)' : 'var(--t3)'};
        flex-shrink:0"></div>
      <div style="flex:1">
        <div style="font-size:14px;font-weight:500;color:var(--text)">${escHtml(pl.name)}</div>
        <div style="font-size:11px;color:var(--t2);font-family:var(--m)">${pl.channels.length} channels</div>
      </div>
      ${idx === state.activePlaylist ? '<div style="font-size:16px">✓</div>' : ''}
    `;
    row.addEventListener('click', () => {
      switchPlaylist(idx);
      closePopup();
      updateMobilePlaylistBtn();
    });
    popup.appendChild(row);
  });

  document.body.appendChild(backdrop);
  document.body.appendChild(popup);
}

function updateMobilePlaylistBtn() {
  if (state.playlists.length <= 1) {
    mobileSidebarBtn.style.display = 'none';
    return;
  }
  mobileSidebarBtn.style.display = 'flex';
}

// Theme toggle
$('themeToggle').addEventListener('click', () => {
  const html = document.documentElement;
  const isDark = html.getAttribute('data-theme') === 'dark';
  const next = isDark ? 'light' : 'dark';
  html.setAttribute('data-theme', next);
  localStorage.setItem('ks_theme', next);
});

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space')         { e.preventDefault(); togglePlayPause(); }
  if (e.code === 'ArrowRight')    navigateChannel(1);
  if (e.code === 'ArrowLeft')     navigateChannel(-1);
  if (e.code === 'ArrowUp')       { videoEl.volume = Math.min(1, videoEl.volume + 0.1); $('volSlider').value = videoEl.volume; }
  if (e.code === 'ArrowDown')     { videoEl.volume = Math.max(0, videoEl.volume - 0.1); $('volSlider').value = videoEl.volume; }
  if (e.code === 'KeyF')          $('fullscreenBtn').click();
  if (e.code === 'KeyM')          $('muteBtn').click();
});

// Mobile detection
function checkMobile() {
  const isMobile = window.innerWidth <= 768;
  if (isMobile) {
    sidebar.classList.remove('collapsed');
    updateMobilePlaylistBtn();
  } else {
    mobileSidebarBtn.style.display = 'none';
  }
}
// Hide fullscreen btn if not supported
if (!document.documentElement.requestFullscreen) {
  $('fullscreenBtn').style.display = 'none';
}
window.addEventListener('resize', checkMobile);
checkMobile();

// Close sidebar on mobile after channel selection
const origPlay = playChannel;
function playChannelWithClose(idx) {
  origPlay(idx);
  if (window.innerWidth <= 768) {
    sidebar.classList.remove('mobile-open');
  }
}

/* ── Utils ── */
function escHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escAttr(str) {
  return String(str).replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// Persist last played
function saveLastChannel(plIdx, chIdx) {
  try { localStorage.setItem('sv_last', JSON.stringify({plIdx, chIdx})); } catch{}
}
function loadLastChannel() {
  try { return JSON.parse(localStorage.getItem('sv_last')); } catch{ return null; }
}

// Detect OS theme on first load
const savedTheme = localStorage.getItem('ks_theme');
const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
document.documentElement.setAttribute('data-theme', savedTheme || (prefersDark ? 'dark' : 'light'));

/* ── BOOT ── */
init();
</script>
</body>
</html>
